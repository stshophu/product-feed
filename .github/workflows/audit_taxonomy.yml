name: Taxonomy Audit (read-only)

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Run taxonomy audit
        env:
          SHOPIFY_DOMAIN: ${{ secrets.SHOPIFY_DOMAIN }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: node audit_taxonomy.js
      - name: Upload audit CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonomy-audit
          path: taxonomy_audit.csv
          if-no-files-found: warn
